<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Choose a new password | Pleniora AI</title><link rel="stylesheet" href="css/market.css"></head><body class="auth-body"><main class="auth-wrap"><div class="auth-top"><a class="m-brand" href="/"><span>P</span> Pleniora AI</a></div><section class="auth-card"><h1>Choose a new password</h1><p>Enter the 6-digit code from your email. Codes expire in 10 minutes.</p><form id="authForm" data-action="reset-password"><label for="resetEmail">Email address</label><input id="resetEmail" name="email" type="email" autocomplete="email" required><label for="otp">6-digit reset code</label><input id="otp" name="otp" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required><label for="password">New password (at least 10 characters)</label><input id="password" name="password" type="password" autocomplete="new-password" required minlength="10"><button class="m-btn">Update password</button></form><div id="feedback" aria-live="polite"></div></section></main><script src="js/auth.js"></script></body></html>
