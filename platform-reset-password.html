<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Choose a new platform password | Pleniora AI</title><link rel="stylesheet" href="css/market.css"></head><body class="auth-body"><main class="auth-wrap"><div class="auth-top"><a class="m-brand" href="/"><span>P</span> Pleniora AI</a></div><section class="auth-card"><h1>Choose a new Super Admin password</h1><p>Enter the 6-digit code from your email and choose a password of at least 12 characters. The code expires in 10 minutes.</p><form id="platformReset"><label for="resetEmail">Admin email</label><input name="email" id="resetEmail" type="email" autocomplete="email" required><label for="resetOtp">6-digit reset code</label><input name="otp" id="resetOtp" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required><label>New password</label><input name="password" type="password" minlength="12" required autocomplete="new-password"><button class="m-btn">Reset Super Admin password</button></form><div id="feedback" aria-live="polite"></div></section></main><script src="js/platform-recovery.js"></script></body></html>
