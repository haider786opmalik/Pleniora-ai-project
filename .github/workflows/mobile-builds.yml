name: Build offline mobile apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build Android APK (Offline)
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android API 36
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Install dependencies
        run: npm ci
      - name: Prepare offline app files
        run: npm run mobile:build
      - name: Create Android project
        run: npx cap add android
      - name: Sync Android project
        run: npm run mobile:sync -- android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload Android APK
        uses: actions/upload-artifact@v6
        with:
          name: pleniora-offline-android-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  ios:
    name: Build iOS Project (Offline)
    runs-on: macos-26
    steps:
      - name: Check out project
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Confirm Xcode version
        run: xcodebuild -version
      - name: Install dependencies
        run: npm ci
      - name: Prepare offline app files
        run: npm run mobile:build
      - name: Create iOS project
        run: npx cap add ios
      - name: Sync iOS project
        run: npm run mobile:sync -- ios
      - name: Build iOS Simulator app
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO
      - name: Package iOS build
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/Build/Products/Debug-iphonesimulator/App.app build/ios/Pleniora-iOS-Simulator.zip
      - name: Upload iOS build artifact
        uses: actions/upload-artifact@v6
        with:
          name: pleniora-offline-ios-simulator-build
          path: build/ios/Pleniora-iOS-Simulator.zip
          if-no-files-found: error
